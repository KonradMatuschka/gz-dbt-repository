version: 2

sources: 
  - name: gz_raw_data
    tables:
      - name: sales 
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: nr. of order identifier
          - name: pdt_id
            description: product identifier
          - name: revenue
            description: revenue per order 
          - name: quantity
            description: quantity ordered per order
        tests:
          - unique: 
              column_name: "(orders_id||pdt_id)"
      - name: product
        identifier: raw_gz_product
        description: product list of Greenweez
        columns: 
          - name: products_id
            description: primary key / product identifier
            tests:
              - unique
              - not_null
          - name: purchSE_PRICE
            description: price per product
      - name: ship
        identifier: raw_gz_ship
        description: shipping list of Greenweez
        columns: 
          - name: orders_id
            description: nr. of order identifier
            tests:
              - unique
              - not_null
          - name: shipping_fee
            description: cost per shipping
          - name: shipping_fee_1
            description: cost per shipping
          - name: logCost
            description: logistical costs 
          - name: ship_cost
            description: shipping costs 

models:
   - name: int_sales_margin
     description: margin calculation per order
     columns:
       - name: orders_id
         description: orders key
         tests:
           - not_null
       - name: products_id
         description: products key
         tests:
           - not_null
       - name: margin
         description: Margin = Revenue - Purchase_cost
         tests:
           - not_null
       - name: Purchase_cost
         description: Purchase_cost = Quantity * Purchase_price
         tests:
           - not_null
       - name: date_date
         description: date of the order
         tests:
           - not_null
       - name: revenue
         description: sum of revenue per order
         tests:
           - not_null
       - name: quantity
         description: sum of quantity per order
         tests:
           - not_null
     tests:
       - unique:
           column_name: "(orders_id || '-' || products_id)"